pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'lumlib'

// Cada pasta tem o proprio plugin Loom, Minecraft, Fabric API e Mod Menu
// (build.gradle + gradle.properties dela). O codigo compartilhado fica em common/.
include 'fabric-1.21-1.21.1'
include 'fabric-1.21.2-1.21.5'
include 'fabric-1.21.6-1.21.8'
include 'fabric-1.21.9-1.21.10'
include 'fabric-1.21.11'
include 'fabric-26.1-26.1.2'
include 'fabric-26.2'
include 'fabric-26.3'
